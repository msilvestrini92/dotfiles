- defaults:
    link:
      relink: true
      create: true
      relative: true
      force: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- clean: ['~']

- link:
    ~/.gitconfig: git/gitconfig
    ~/.tmux.conf: tmux/tmux.conf
    ~/.vimrc: vim/vimrc
    ~/.bashrc: bash/bashrc
    ~/.bash_profile: bash/bash_profile
